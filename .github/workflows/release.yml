name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build app
        env:
          USAGEBAR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: scripts/build-app.sh --no-install --zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            .build/UsageBar.app.zip
            .build/UsageBar.app.zip.sha256
