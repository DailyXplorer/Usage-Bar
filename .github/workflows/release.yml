name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build app
        env:
          USAGEBAR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: scripts/build-app.sh --no-install --zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .build/UsageBar.app.zip
